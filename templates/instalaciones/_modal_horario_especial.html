<dialog class="modal-confirmacion perfil-modal horarios-pagina horario-modal" id="modal-horario-especial" data-modal-horarios="horario-especial" aria-labelledby="modal-horario-especial-titulo">
    {% include "instalaciones/_modal_horario_especial_contenido.html" with formulario=formulario_horario_especial csrf_token=csrf_token only %}
</dialog>
<template data-error-carga-horario>
    <div class="modal-confirmacion-formulario">
        <header class="modal-confirmacion-cabecera">
            <h2 id="modal-horario-especial-titulo" tabindex="-1" data-modal-titulo>Horario especial</h2>
        </header>
        <div class="modal-confirmacion-contenido">
            <p class="mensaje mensaje-error" role="alert"></p>
        </div>
        <footer class="modal-confirmacion-acciones">
            <button class="boton boton-secundario" type="button" data-modal-cerrar>Cerrar</button>
        </footer>
    </div>
</template>
