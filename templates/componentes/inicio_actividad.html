<a class="portal-actividad-fila" href="{{ actividad.url }}">
    <div class="portal-actividad-horario">
        <strong>{{ actividad.referencia }} · {{ actividad.hora_inicio|time:"H:i" }}–{{ actividad.hora_fin|time:"H:i" }}</strong>
        <span>{{ actividad.sede }} · {{ actividad.cancha }}</span>
    </div>
    <span class="portal-funcion portal-funcion-{{ actividad.funcion_clase }}">{{ actividad.funcion }}</span>
</a>
