<dialog class="modal-confirmacion" data-modal-confirmacion aria-labelledby="modal-confirmacion-titulo" aria-describedby="modal-confirmacion-mensaje">
    <form method="dialog" class="modal-confirmacion-formulario">
        <header class="modal-confirmacion-cabecera">
            <h2 id="modal-confirmacion-titulo" data-modal-titulo>Confirmar acción</h2>
        </header>
        <div class="modal-confirmacion-contenido">
            <p id="modal-confirmacion-mensaje" data-modal-mensaje></p>
        </div>
        <footer class="modal-confirmacion-acciones">
            <button class="boton boton-secundario" type="submit" value="cancelar" autofocus>Cancelar</button>
            <button class="boton boton-primario" type="submit" value="confirmar" data-modal-confirmar>Confirmar</button>
        </footer>
    </form>
</dialog>
