{% if es_tablist %}
<div class="pestanas{% if clases %} {{ clases }}{% endif %}" role="tablist" aria-label="{{ etiqueta }}">
    {{ contenido }}
</div>
{% else %}
<nav class="pestanas{% if clases %} {{ clases }}{% endif %}" aria-label="{{ etiqueta }}"{% if resultados_filtros %} data-resultados-filtros="{{ resultados_filtros }}"{% endif %}>
    {{ contenido }}
</nav>
{% endif %}
