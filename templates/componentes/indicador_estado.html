{% if figura %}<span class="indicador-estado indicador-estado-{{ color }}" role="img" aria-label="{{ contexto }}: {{ texto }}" data-tooltip="{{ texto }}"{% if not integrado %} tabindex="0"{% endif %}>
    <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        {% if figura == 'check' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
        {% elif figura == 'cruz' %}<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>
        {% elif figura == 'reloj' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        {% elif figura == 'error' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>
        {% elif figura == 'pregunta' %}<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 5 2c-1 1-2 1-2 3m0 3h.01"/>
        {% elif figura == 'descartado' %}<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>
        {% elif figura == 'proceso' %}<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M18 18a8 8 0 0 1-14-6"/>
        {% elif figura == 'calendario' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>
        {% elif figura == 'curso' %}<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/>
        {% elif figura == 'abierto' or figura == 'cerrado' %}<rect x="5" y="10" width="14" height="11" rx="2"/>{% if figura == 'abierto' %}<path d="M8 10V6a4 4 0 0 1 8 0"/>{% else %}<path d="M8 10V6a4 4 0 0 1 8 0v4"/>{% endif %}<path d="M12 14v3"/>
        {% endif %}
    </svg><span class="indicador-estado-impresion">{{ texto }}</span>
</span>{% else %}{{ texto }}{% endif %}
