<details class="tarjeta tarjeta-filtros"{% if abierto %} open{% endif %}>
    <summary>
        {% include "componentes/iconoir/chevron-abajo.html" %}
        Filtros
    </summary>
    <div class="tarjeta-filtros-contenido">
        {{ contenido }}
        <div data-aviso-filtros role="status"></div>
        <template data-filtro-borrar-texto>
            <button type="button" class="filtro-borrar-texto" aria-label="Borrar texto" hidden>
                {% include "componentes/iconoir/cruz.html" %}
            </button>
        </template>
    </div>
</details>
