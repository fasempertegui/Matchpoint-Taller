<span class="agenda-estado-icono" {% if not en_grilla %}tabindex="0"{% endif %} role="img" aria-label="Estado: {% if evento.estado == 'programado' and estado_temporal == 'En curso' %}En curso{% else %}{{ evento.get_estado_display }}{% endif %}" title="{% if evento.estado == 'programado' and estado_temporal == 'En curso' %}En curso{% else %}{{ evento.get_estado_display }}{% endif %}">
    <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="1.5" fill="none" aria-hidden="true" focusable="false">
        {% if evento.estado == 'programado' %}
        <path d="M12 6L12 12L18 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        {% elif evento.estado == 'finalizado' %}
        <path d="M5 13L9 17L19 7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        {% elif evento.estado == 'anulado' %}
        <path d="M6.75827 17.2426L12.0009 12M17.2435 6.75736L12.0009 12M12.0009 12L6.75827 6.75736M12.0009 12L17.2435 17.2426" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        {% endif %}
    </svg>
</span>
