{% if puede_anular or puede_bloquear or puede_eliminar %}
<div class="acciones-anulacion">
    {% if puede_anular %}<a class="boton boton-peligro boton-chico" href="{% url 'clases:clase_anular' clase_id %}">Anular y liberar</a>{% endif %}
    {% if puede_bloquear %}<a class="boton boton-peligro boton-chico" href="{% url 'clases:clase_anular_bloquear' clase_id %}">Anular y bloquear</a>{% endif %}
    {% if puede_eliminar %}<a class="boton boton-peligro boton-chico" href="{% url 'clases:clase_eliminar' clase_id %}">Eliminar clase generada</a>{% endif %}
</div>
{% endif %}
