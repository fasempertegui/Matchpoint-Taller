<form class="accion-finalizar-clase" method="post" action="{% url 'clases:clase_finalizar' clase_id %}"
      data-confirmar="¿Finalizar la clase {{ clase_id }}? Se conservan el turno y las asignaciones. La asistencia no se modifica."
      data-confirmar-titulo="Finalizar clase" data-confirmar-boton="Confirmar">
    {% csrf_token %}
    <button class="boton boton-secundario boton-chico" type="submit">Finalizar clase</button>
</form>
