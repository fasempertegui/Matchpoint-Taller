{% extends "base.html" %}
{% block titulo %}Verificar correo | Academia TM{% endblock %}
{% block navegacion %}{% endblock %}
{% block contenido %}
<section class="tarjeta">
    <h1>Verificar correo</h1>
    <p>{{ resultado }}</p>
    {% if request.user.is_authenticated %}
        <a class="boton boton-primario" href="{% url 'inicio' %}">Ir a inicio</a>
    {% else %}
        <a class="boton boton-primario" href="{% url 'login' %}">Iniciar sesión</a>
    {% endif %}
</section>
{% endblock %}
