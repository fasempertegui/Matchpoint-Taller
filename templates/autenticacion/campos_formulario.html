{% if form.non_field_errors %}
    <div class="mensaje mensaje-error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for campo in form %}
    <div class="grupo-campo">
        <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% if campo.help_text %}
            <div class="texto-secundario" id="{{ campo.auto_id }}_helptext">{{ campo.help_text|safe }}</div>
        {% endif %}
        {% if campo.errors %}
            <div class="error-campo" id="{{ campo.auto_id }}_error" role="alert">{{ campo.errors }}</div>
        {% endif %}
    </div>
{% endfor %}
