{% extends "base.html" %}
{% block titulo %}Elegir contraseña | Academia TM{% endblock %}
{% block contenido %}<section class="tarjeta tarjeta-formulario"><h1>Elegir una contraseña</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="boton boton-primario" type="submit">Guardar contraseña</button></form>{% else %}<p>El enlace venció o ya no es válido.</p><a href="{% url 'password_reset' %}">Solicitar otro enlace</a>{% endif %}</section>{% endblock %}
