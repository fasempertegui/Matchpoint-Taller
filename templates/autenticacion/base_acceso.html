{% extends "base_publica.html" %}
{% load static %}

{% block estilos %}
<link rel="stylesheet" href="{% static 'css/acceso.css' %}">
<link rel="stylesheet" href="{% static 'css/toasts.css' %}">
{% endblock %}
{% block scripts %}
<script src="{% static 'js/acceso.js' %}" defer></script>
<script src="{% static 'js/mensajes.js' %}" defer></script>
{% endblock %}

{% block body %}
<a class="skip-link" href="#contenido">Ir al contenido</a>
<div class="shell acceso {% block clase_acceso %}{% endblock %}">
    <header class="acceso-header">
        <a class="brand" href="{% url 'landing' %}">
            {% include "componentes/logotipo.html" %}
        </a>
    </header>
    <main class="acceso-panel" id="contenido" tabindex="-1" aria-labelledby="acceso-titulo">
        {% block acceso_contenido %}{% endblock %}
    </main>
</div>
{% include "componentes/toasts.html" %}
{% endblock %}
