name: atm

services:
  web:
    image: atm-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atm_web
    restart: unless-stopped
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    environment: &entorno_aplicacion
      DB_NAME: atm
      DB_USER: atm
      DB_PASSWORD: atm_dev
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CUENTAS_LIMPIEZA_HABILITADA: "${CUENTAS_LIMPIEZA_HABILITADA:-0}"
      EMAILS_TAREAS_PROGRAMADAS_HABILITADAS: "${EMAILS_TAREAS_PROGRAMADAS_HABILITADAS:-0}"
      EMAILS_SIMULACION: "${EMAILS_SIMULACION:-1}"
      EMAILS_HABILITADOS: "${EMAILS_HABILITADOS:-0}"
      EMAILS_ENTREGA_EXTERNA_HABILITADA: "${EMAILS_ENTREGA_EXTERNA_HABILITADA:-0}"
      EMAILS_URL_PUBLICA: "${EMAILS_URL_PUBLICA:-http://localhost:8000}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.locmem.EmailBackend}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-Academia TM <academia@localhost>}"
      EMAIL_HOST: "${EMAIL_HOST:-localhost}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-1}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-0}"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      inicializar:
        condition: service_completed_successfully

  inicializar:
    image: atm-app
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: >-
      sh -ec 'python manage.py migrate --noinput;
      if [ "$$CARGAR_DATOS_EJEMPLO" = "1" ]; then
      python manage.py cargar_datos_ejemplo;
      fi'
    environment:
      <<: *entorno_aplicacion
      CARGAR_DATOS_EJEMPLO: ${CARGAR_DATOS_EJEMPLO:-1}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.30.4
    container_name: atm_mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data

  redis:
    image: redis:8-alpine
    container_name: atm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: atm-app
    container_name: atm_worker
    restart: unless-stopped
    working_dir: /app
    command: celery -A config worker --loglevel=INFO --concurrency=2
    environment: *entorno_aplicacion
    volumes:
      - .:/app
    depends_on:
      inicializar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    image: atm-app
    container_name: atm_beat
    restart: unless-stopped
    working_dir: /app
    command: celery -A config beat --loglevel=INFO --schedule=/var/lib/celery/celerybeat-schedule
    environment: *entorno_aplicacion
    volumes:
      - .:/app
      - celery_schedule:/var/lib/celery
    depends_on:
      inicializar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: atm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: atm
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: atm_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm -d atm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: atm_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mailpit_data:
  postgres_data:
  redis_data:
  celery_schedule:
