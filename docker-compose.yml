name: atm

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atm_web
    restart: unless-stopped
    working_dir: /app
    command: >-
      sh -c "if [ -f manage.py ]; then
      python manage.py runserver 0.0.0.0:8000;
      else
      echo 'Contenedor listo. Crea el proyecto Django dentro de /app.';
      tail -f /dev/null;
      fi"
    environment:
      DB_NAME: atm
      DB_USER: atm
      DB_PASSWORD: atm_dev
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: atm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: atm
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: atm_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm -d atm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: atm_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
